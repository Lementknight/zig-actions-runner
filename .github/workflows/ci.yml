name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Runs the database integration tests; see the db-integration job.
  workflow_dispatch:

env:
  ZIG_VERSION: "0.17.0"
  # The Agda the proofs are checked with, here and in the hooks (proofs/check.sh reads it from here),
  # and the checksum of the release binary this pins to. See proofs/README.md.
  AGDA_VERSION: "2.8.0.2"
  AGDA_SHA256: "2bcf24bb561b1be859bba841e5d67962d1616b3251bc147f878e4f60a2fbd9f7"

jobs:
  unit:
    name: Zig unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          arch=$(uname -m)
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${arch}-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C /opt
          echo "/opt/zig-${arch}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      # On the first `zig build` of a job, Zig builds its own build runner and standard library for
      # the host. That was ~95 s of this job's ~120 s, paid by whichever step runs `zig build` first
      # — the workflow check, measured at 99-103 s against 12 ms for the checker itself. The cache
      # holds nothing project-specific (there are no package dependencies), so one entry per Zig
      # version per OS is enough and the key is stable: it is written once and read thereafter.
      # Only here, not on the self-hosted job, where uploading a cache is what experiment 6.6
      # measured at 2 MB/s.
      - name: Cache Zig's global cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-global-${{ env.ZIG_VERSION }}

      - name: Format check
        working-directory: runner
        run: zig fmt --check .

      # The workflow YAML of this repository, with the parser the runner uses (tools/check_workflows.zig).
      - name: Check workflow YAML
        working-directory: runner
        run: zig build check-workflows

      # The git hooks in .githooks/ run these same checks locally (see README.md).
      - name: Lint the git hooks
        run: shellcheck -x .githooks/pre-commit .githooks/pre-push .githooks/zig-common.sh

      # Database tests skip themselves here: no PG* variables are set on this job.
      - name: Test
        working-directory: runner
        run: zig build test --summary all

  proofs:
    name: Agda proofs of the step cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Agda project's own release binary, pinned by version and checksum, so this and a
      # developer's machine check the same language: apt's Agda is 2.6.3 and these proofs do not
      # type-check on it. The Linux build is statically linked, so it needs no packages, and the
      # proofs import no library, so it needs no data directory (`agda --setup` would make one).
      - name: Install Agda ${{ env.AGDA_VERSION }}
        run: |
          v=${{ env.AGDA_VERSION }}
          curl -fsSL -o /tmp/agda.tar.xz \
            "https://github.com/agda/agda/releases/download/v$v/Agda-v$v-linux.tar.xz"
          echo "${{ env.AGDA_SHA256 }}  /tmp/agda.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf /tmp/agda.tar.xz -C "$HOME/.local/bin"
          mv "$HOME/.local/bin/agda" "$HOME/.local/bin/agda-$v"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agda-$v" --version

      # Every module is --safe, so a clean run is the whole claim; see proofs/README.md.
      - name: Check the proofs
        run: ./proofs/check.sh

  db-integration:
    name: Database integration (Tiger Data)
    # This project's own runner, so a workflow run exercises it too. Manual only: the job waits for a
    # runner with these labels, so it must not be triggered by every push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, zig]
    env:
      # The standard libpq variables; the tests read them. The secrets are the repository's
      # TIGER_* secrets and never appear in logs (masked).
      PGHOST: ${{ secrets.TIGER_HOST }}
      PGPORT: ${{ secrets.TIGER_PORT }}
      PGDATABASE: ${{ secrets.TIGER_DB_NAME }}
      PGUSER: ${{ secrets.TIGER_USERNAME }}
      PGPASSWORD: ${{ secrets.TIGER_PASSWORD }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          arch=$(uname -m)
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${arch}-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C /opt
          echo "/opt/zig-${arch}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      # Each database test creates a scratch schema ("zig_it_<random>"), applies db/migrations/001_init.sql
      # inside it, and drops it afterwards, so real tables and data are never touched.
      # `zig test` (not `zig build test`) so the run is never served from the build cache.
      - name: Database tests over TLS
        working-directory: runner
        run: zig test src/main.zig

      # Proves the tests cleaned up after themselves and shows what the database holds. Prints no
      # credentials and no host name (this repository's logs are public).
      - name: Database check
        working-directory: runner
        run: zig build run -- --db-check
