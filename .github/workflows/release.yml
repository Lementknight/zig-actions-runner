# Release: on a version tag, static runner binaries (x86_64 and aarch64 Linux) on a GitHub release,
# and the runner image (linux/amd64 and linux/arm64) on GitHub's container registry.
# On pull requests that touch the runner's packaging, only checks that the image builds.
# Run by hand with a tag to (re)build and push that tag's image.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag whose image to build and push (v0.1.0)"
        required: true
  pull_request:
    paths:
      - runner/Dockerfile
      - runner/build.zig
      - deploy/**
      - .github/workflows/release.yml

env:
  ZIG_VERSION: "0.17.0"
  # The tag released: pushed, or given by hand.
  TAG: ${{ inputs.tag || github.ref_name }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

jobs:
  binaries:
    name: Binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          arch=$(uname -m)
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${arch}-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C /opt
          echo "/opt/zig-${arch}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Build
        working-directory: runner
        run: |
          mkdir -p ../dist
          # The tag, not `git describe`: checkout fetches no tags, so a derived version would
          # silently be the package's own. This is the authoritative name for the build anyway.
          for arch in x86_64 aarch64; do
            zig build -Doptimize=ReleaseSafe -Dstrip -Dversion="$GITHUB_REF_NAME" -Dtarget="${arch}-linux-musl" --prefix "/tmp/${arch}"
            cp "/tmp/${arch}/bin/runner" "../dist/zig-runner-linux-${arch}"
          done
          cd ../dist && sha256sum zig-runner-* > SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag

  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3

      # Registry names must be lowercase; owners often are not (Lementknight).
      - name: Image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/zig-runner" >> "$GITHUB_ENV"

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build (and push, for a tag)
        uses: docker/build-push-action@v6
        with:
          context: runner
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          build-args: |
            VERSION=${{ env.TAG }}
          # A pull request's ref (`123/merge`) is no image tag; it builds under a local name.
          tags: ${{ env.PUBLISH == 'true' && format('{0}:{1},{0}:latest', env.IMAGE, env.TAG) || 'zig-runner:check' }}
